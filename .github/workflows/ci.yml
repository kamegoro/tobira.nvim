name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly, off-peak UTC — feeds only the differential-stress job below
    # (every other job is scoped to push/pull_request via its own `if:`,
    # see #343).
    - cron: '0 18 * * *'

jobs:
  checks:
    name: Checks (lint & scripts)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - parallel:
          - name: Check formatting (stylua)
            uses: JohnnyMorganz/stylua-action@v5
            with:
              token: ${{ secrets.GITHUB_TOKEN }}
              version: latest
              args: --check lua/ plugin/

          - name: Lint (selene)
            env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              url=$(gh api repos/Kampfkarren/selene/releases/latest \
                --jq '.assets[] | select(.name | test("^selene-[0-9].*-linux\\.zip$")) | .browser_download_url')
              curl -sSfL -o selene.zip "$url"
              unzip -o selene.zip
              chmod +x selene
              ./selene --display-style=quiet lua/ plugin/

          - name: Scripts (Python unit tests)
            run: |
              python3 -m unittest discover -s .github/scripts -p "test_*.py" -v
              python3 .github/scripts/check_adr_numbering.py

  test:
    name: Test (Neovim nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim nightly
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - name: Run tests
        run: |
          nvim --headless --noplugin -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/spec/ {minimal_init = 'tests/minimal_init.lua', sequential = true}"

      - name: Run differential state-machine tests
        run: |
          nvim --headless --noplugin -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/differential/ {minimal_init = 'tests/minimal_init.lua', sequential = true}"

  regression:
    name: Regression suites (tracks #315 — non-blocking until known bugs are fixed)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim nightly
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - name: Run realistic-scale and long-session regression suites
        # continue-on-error: several `it()` blocks in these suites are KNOWN
        # FAILING by design — they document real, still-open bugs (#291, #292,
        # #307, #310, #314) so the suites report visibly in every PR without
        # blocking merges on bugs unrelated to that PR. Remove
        # continue-on-error once all tracked issues are closed and every
        # block in tests/regression/ passes for real.
        continue-on-error: true
        run: |
          nvim --headless --noplugin -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/regression/ {minimal_init = 'tests/minimal_init.lua', sequential = true}"

  coverage:
    name: Coverage (100%) · Neovim stable
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim stable
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install lua5.1 and luacov
        run: |
          sudo apt-get install -y lua5.1 luarocks
          luarocks --lua-version=5.1 install --local luacov

      - name: Run tests with coverage
        run: |
          COVERAGE=1 nvim --headless --noplugin -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/spec/ {minimal_init = 'tests/minimal_init.lua', sequential = true}"
          LUA_PATH="$HOME/.luarocks/share/lua/5.1/?.lua;$HOME/.luarocks/share/lua/5.1/?/init.lua;;" \
            lua5.1 -e "require('luacov.reporter').report()"

      - name: Print coverage report
        if: always()
        run: cat luacov.report.out 2>/dev/null || echo "(no report generated)"

      - name: Enforce 100% coverage on tobira/ modules
        run: python3 .github/scripts/check_coverage.py luacov.report.out

  differential-stress:
    name: Differential stress (opt-in, high-scale)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim nightly
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - name: Run differential state-machine tests at high scale
        # TOBIRA_DIFFERENTIAL_SEEDS overrides the committed default of 150
        # (see tests/differential/*_spec.lua). 20000 is in the range QA
        # agents have actually run ad hoc during PR review and found real
        # bugs at (#343) -- this is not run on every PR (see the
        # workflow-level `on:` block and this job's own `if:` above), only
        # on a nightly schedule and on manual workflow_dispatch, so it can
        # afford to run far past the ~50s per-file budget the committed,
        # PR-blocking suite is scoped to.
        #
        # Never run this with COVERAGE=1 -- luacov's per-line instrumentation
        # slows tests/differential/ by roughly two orders of magnitude and
        # would blow even the generous timeout below (see tests/CLAUDE.md).
        env:
          TOBIRA_DIFFERENTIAL_SEEDS: 20000
        run: |
          nvim --headless --noplugin -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/differential/ {minimal_init = 'tests/minimal_init.lua', sequential = true, timeout = 3600000}"
