name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Checks (lint & scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - parallel:
          - name: Check formatting (stylua)
            uses: JohnnyMorganz/stylua-action@v5
            with:
              token: ${{ secrets.GITHUB_TOKEN }}
              version: latest
              args: --check lua/ plugin/

          - name: Lint (selene)
            uses: AlejandroSuero/selene-linter-action@v1.0.0
            with:
              token: ${{ secrets.GITHUB_TOKEN }}
              args: --display-style=quiet lua/ plugin/

          - name: Scripts (Python unit tests)
            run: |
              python3 -m unittest discover -s .github/scripts -p "test_*.py" -v
              python3 .github/scripts/check_adr_numbering.py

  test:
    name: Test (Neovim nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim nightly
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - name: Run tests
        run: |
          nvim --headless --noplugin -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/spec/ {minimal_init = 'tests/minimal_init.lua', sequential = true}"

      - name: Run differential state-machine tests
        run: |
          nvim --headless --noplugin -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/differential/ {minimal_init = 'tests/minimal_init.lua', sequential = true}"

  regression:
    name: Regression suites (tracks #315 — non-blocking until known bugs are fixed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim nightly
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - name: Run realistic-scale and long-session regression suites
        # continue-on-error: several `it()` blocks in these suites are KNOWN
        # FAILING by design — they document real, still-open bugs (#291, #292,
        # #307, #310, #314) so the suites report visibly in every PR without
        # blocking merges on bugs unrelated to that PR. Remove
        # continue-on-error once all tracked issues are closed and every
        # block in tests/regression/ passes for real.
        continue-on-error: true
        run: |
          nvim --headless --noplugin -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/regression/ {minimal_init = 'tests/minimal_init.lua', sequential = true}"

  coverage:
    name: Coverage (100%) · Neovim stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim stable
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install lua5.1 and luacov
        run: |
          sudo apt-get install -y lua5.1 luarocks
          luarocks --lua-version=5.1 install --local luacov

      - name: Run tests with coverage
        run: |
          COVERAGE=1 nvim --headless --noplugin -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/spec/ {minimal_init = 'tests/minimal_init.lua', sequential = true}"
          LUA_PATH="$HOME/.luarocks/share/lua/5.1/?.lua;$HOME/.luarocks/share/lua/5.1/?/init.lua;;" \
            lua5.1 -e "require('luacov.reporter').report()"

      - name: Print coverage report
        if: always()
        run: cat luacov.report.out 2>/dev/null || echo "(no report generated)"

      - name: Enforce 100% coverage on tobira/ modules
        run: python3 .github/scripts/check_coverage.py luacov.report.out
